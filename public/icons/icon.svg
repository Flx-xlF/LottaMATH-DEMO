<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="50%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle Wave Glow -->
  <path d="M 50 380 Q 180 300 256 380 T 462 380" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 50 420 Q 180 340 256 420 T 462 420" fill="none" stroke="rgba(124, 77, 255, 0.4)" stroke-width="16" stroke-linecap="round"/>

  <!-- Center Math Monogram -->
  <text x="256" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">LM</text>
  
  <!-- Mathematical Formula Subtitle -->
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="44" fill="#ffd700" text-anchor="middle" letter-spacing="4">(a + b)²</text>
  
  <!-- Sparkles -->
  <circle cx="110" cy="130" r="14" fill="#00e5ff"/>
  <circle cx="410" cy="140" r="18" fill="#ffd700"/>
  <circle cx="390" cy="270" r="10" fill="#ff4081"/>
</svg>